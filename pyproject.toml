[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomarker-validation-agent"
version = "0.1.0"
description = "Auditable virtual validation for RNA/protein expression biomarkers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.urls]
Documentation = "https://github.com/Yuan-s6s/biomarker-validation-agent#readme"
Issues = "https://github.com/Yuan-s6s/biomarker-validation-agent/issues"
Source = "https://github.com/Yuan-s6s/biomarker-validation-agent"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
biomarker-agent = "biomarker_agent.cli:main"
biomarker-confidence = "biomarker_agent.confidence_cli:main"
biomarker-external = "biomarker_agent.external_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
